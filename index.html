<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Notes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="bg-gradient"></div>

    <main class="app-container">
        <header>
            <div class="header-content">
                <h1>Notes</h1>
            </div>
            <button id="add-note-btn" class="btn primary-btn">
                <i class="fas fa-plus"></i> New Note
            </button>
        </header>

        <section class="notes-grid" id="notes-grid">
            <!-- Notes will be injected here -->
        </section>
    </main>

    <!-- Modal -->
    <div class="modal-overlay" id="note-modal">
        <div class="modal-card">
            <div class="modal-header">
                <h2 id="modal-title">Create Note</h2>
                <button class="icon-btn" id="close-modal"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <input type="text" id="note-title-input" placeholder="Title" autocomplete="off">
                <textarea id="note-content-input" placeholder="Write something..."></textarea>
            </div>
            <div class="modal-footer">
                <button class="btn text-btn" id="cancel-note">Cancel</button>
                <button class="btn primary-btn" id="save-note">Save</button>
            </div>
            <input type="hidden" id="note-id-input">
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
